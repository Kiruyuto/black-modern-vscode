name: "Sync VS Code theme defaults"

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: "Sync upstream theme files"
    runs-on: ["ubuntu-latest"]
    timeout-minutes: 10

    steps:
      - name: "Checkout theme repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "destination"
          persist-credentials: false

      - name: "Checkout VS Code theme files"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "microsoft/vscode"
          ref: "main"
          path: "upstream"
          sparse-checkout: |
            extensions/theme-defaults/themes/dark_plus.json
            extensions/theme-defaults/themes/dark_vs.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: "Copy theme files"
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          source_dir="upstream/extensions/theme-defaults/themes"
          destination_dir="destination/themes/upstream/vscode"
          files=("dark_plus.json" "dark_vs.json")

          for file in "${files[@]}"; do
            cp -- "$source_dir/$file" "$destination_dir/$file"
          done

          sha="$(git -C upstream rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: "Generate App Token"
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.BOT_ClientId }}
          private-key: ${{ secrets.BOT_PrivateKey }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: "Create synchronization pull request"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          path: "destination"
          base: ${{ github.event.repository.default_branch }}
          add-paths: |
            themes/upstream/vscode/dark_plus.json
            themes/upstream/vscode/dark_vs.json
          branch: automation/sync-vscode-themes
          delete-branch: true
          commit-message: "chore: Sync VS Code theme defaults"
          title: "chore: Sync VS Code theme defaults"
          body: |
            Synchronizes the vendored default themes from Microsoft VS Code.

            Upstream revision: [`${{ steps.sync.outputs.sha }}`](https://github.com/microsoft/vscode/commit/${{ steps.sync.outputs.sha }})
