name: "CI"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: "Package Extension"
    runs-on: ["ubuntu-latest"]
    timeout-minutes: 10

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: "Package extension"
        run: npx --yes @vscode/vsce package --githubBranch master --no-dependencies --out black-modern-vscode.vsix

      - name: "Verify packaged contents"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = [System.IO.Compression.ZipFile]::OpenRead(
            (Resolve-Path -LiteralPath "black-modern-vscode.vsix")
          )

          try {
            $entries = @($archive.Entries.FullName)
            $requiredEntries = @(
              "extension/package.json",
              "extension/themes/black-modern-color-theme.json",
              "extension/themes/upstream/vscode/dark_plus.json",
              "extension/themes/upstream/vscode/dark_vs.json"
            )

            foreach ($entry in $requiredEntries) {
              if ($entry -cnotin $entries) {
                throw "Required file is missing from the VSIX: $entry"
              }
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: "Upload packaged extension"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: black-modern-vscode-vsix
          path: black-modern-vscode.vsix
          if-no-files-found: error
          retention-days: 4
