name: "Release"

on:
  push:
    branches: ["master"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: "Release-Please"
    runs-on: ["ubuntu-latest"]
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.run-release-please.outputs.release_created }}
      tag_name: ${{ steps.run-release-please.outputs.tag_name }}
      version: ${{ steps.run-release-please.outputs.version }}

    steps:
      - name: "Generate App Token"
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.BOT_ClientId }}
          private-key: ${{ secrets.BOT_PrivateKey }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: "Run release-please"
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: run-release-please
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - name: "Echo release-please outputs"
        run: echo "$OUTPUTS"
        shell: bash
        env:
          OUTPUTS: ${{ toJSON(steps.run-release-please.outputs) }}

  release-theme-to-marketplace:
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    needs: ["release-please"]
    name: "Release Theme To VS Code Marketplace"
    runs-on: ["ubuntu-latest"]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: "Set up Node.js"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - name: "Publish theme to VS Code Marketplace"
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --githubBranch master --no-dependencies
